services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: prepwise
      POSTGRES_USER: prepwise
      POSTGRES_PASSWORD: prepwise
    ports:
      - "5432:5432"
    volumes:
      - prepwise-db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
volumes:
  prepwise-db:
